<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地技能库 - Local Skills</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .skill-link { color: #667eea; text-decoration: none; font-weight: 500; }
        .skill-link:hover { text-decoration: underline; }
        .update-log { background: #f8f9fa; padding: 1.5rem; border-radius: 10px; margin-top: 2rem; }
        .update-log h3 { color: #667eea; margin-bottom: 1rem; }
        .update-log ul { list-style: none; padding: 0; }
        .update-log li { padding: 0.3rem 0; color: #666; font-size: 0.9rem; }
        .update-log li::before { content: '• '; color: #667eea; }
        .version-tag { display: inline-block; padding: 0.2rem 0.6rem; background: #667eea; color: white; border-radius: 4px; font-size: 0.8rem; margin-right: 0.5rem; }
        .category-section { margin-bottom: 2rem; }
        .category-section h3 { color: #667eea; border-left: 4px solid #667eea; padding-left: 0.8rem; margin-bottom: 1rem; font-size: 1.3rem; }
        .category-section h3 .note { font-size: 0.8rem; color: #999; font-weight: normal; }
        .category-skills { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .skill-chip { display: inline-block; padding: 0.4rem 0.8rem; background: #f0f4ff; border: 1px solid #dce3f8; border-radius: 6px; font-size: 0.85rem; color: #333; }
        .skill-chip.system-builtin { background: #fef3c7; border-color: #fde68a; }
        .highlight-card { background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 100%); border: 1px solid #fde68a; border-radius: 10px; padding: 1rem; }
        .highlight-card h4 { color: #92400e; margin-bottom: 0.3rem; }
        .highlight-card p { color: #666; font-size: 0.85rem; }
        .highlight-card .rating { color: #f59e0b; }
        .stats-detailed { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin: 1rem 0; }
        .stat-detailed-card { text-align: center; padding: 1rem; background: #f8f9fa; border-radius: 8px; }
        .stat-detailed-card .num { font-size: 1.8rem; font-weight: bold; color: #667eea; }
        .stat-detailed-card .label { font-size: 0.85rem; color: #666; margin-top: 0.3rem; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>💾 本地技能库</h1>
            <p class="subtitle" id="subtitle">加载中...</p>
            <nav>
                <a href="index.html">首页</a>
                <a href="skills.html">官方技能商店</a>
                <a href="local-skills.html" class="active">本地技能库</a>
                <a href="https://github.com/aspnmy/skill" target="_blank">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- 统计概览 -->
        <section class="stats" id="stats-section" style="display:none;">
        </section>

        <!-- 分类筛选 -->
        <section class="filters">
            <h2>🔍 按分类筛选</h2>
            <div class="filter-buttons" id="category-filters">
            </div>
        </section>

        <!-- 核心技能推荐 -->
        <section id="highlights-section" style="display:none;">
            <h2>⭐ 核心技能推荐</h2>
            <div class="skills-grid" id="highlights-grid"></div>
        </section>

        <!-- 按分类展示 -->
        <section id="categories-section">
            <h2>📂 技能分类</h2>
            <div id="categories-container"></div>
        </section>

        <!-- 更新日志 -->
        <section id="changelog-section" style="display:none;">
            <h2>📝 更新日志</h2>
            <div id="changelog-container"></div>
        </section>
    </main>

    <footer>
        <div class="container" id="footer-info">
            <p>加载中...</p>
        </div>
    </footer>

    <script>
        async function loadSkills() {
            try {
                const response = await fetch('data/local_skills.json');
                const data = await response.json();
                renderPage(data);
            } catch (error) {
                console.error('加载技能数据失败:', error);
                document.getElementById('subtitle').textContent = '加载失败';
                document.querySelector('main').innerHTML = '<section><p class="error">加载失败，请刷新页面重试</p></section>';
            }
        }

        function renderPage(data) {
            const meta = data.metadata;
            const categories = data.categories;
            const stats = data.statistics;
            const highlights = data.highlights;
            const updateLog = data.update_log;

            // --- 页面副标题 ---
            document.getElementById('subtitle').textContent =
                `共 ${meta.total_skills} 个技能（${meta.core_skills} 核心 + ${meta.sub_skills} 子技能 + ${meta.system_builtin} 系统内置）`;

            // --- 统计卡片 ---
            const statsSection = document.getElementById('stats-section');
            statsSection.style.display = 'block';
            statsSection.innerHTML = '<h2>📊 统计概览</h2><div class="stats" style="padding:0;">' +
                `<div class="stat-card"><h3>${meta.total_skills}</h3><p>技能总数</p></div>` +
                `<div class="stat-card"><h3>${meta.core_skills}</h3><p>核心技能</p></div>` +
                `<div class="stat-card"><h3>${meta.sub_skills}</h3><p>子技能</p></div>` +
                `<div class="stat-card"><h3>${meta.system_builtin}</h3><p>系统内置</p></div>` +
                '</div>';

            if (stats && stats.by_api_requirement) {
                statsSection.innerHTML += '<div class="stats-detailed">' +
                    `<div class="stat-detailed-card"><div class="num">${stats.by_api_requirement['必需API'] || 0}</div><div class="label">必需 API</div></div>` +
                    `<div class="stat-detailed-card"><div class="num">${stats.by_api_requirement['可选API'] || 0}</div><div class="label">可选 API</div></div>` +
                    `<div class="stat-detailed-card"><div class="num">${stats.by_api_requirement['完全免费'] || 0}</div><div class="label">完全免费</div></div>` +
                    '</div>';
            }

            // --- 分类筛选标签 ---
            const categoryKeys = Object.keys(categories);
            const filterContainer = document.getElementById('category-filters');
            filterContainer.innerHTML = '<button class="filter-btn active" data-cat="all">全部</button>';
            categoryKeys.forEach(key => {
                filterContainer.innerHTML += `<button class="filter-btn" data-cat="${key}">${key} (${categories[key].count})</button>`;
            });

            // 绑定筛选事件
            filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const cat = this.dataset.cat;
                    document.querySelectorAll('.category-section').forEach(section => {
                        section.style.display = (cat === 'all' || section.dataset.category === cat) ? 'block' : 'none';
                    });
                });
            });

            // --- 核心技能推荐 ---
            if (highlights && highlights.core_skills && highlights.core_skills.length > 0) {
                const hsSection = document.getElementById('highlights-section');
                hsSection.style.display = 'block';
                const grid = document.getElementById('highlights-grid');
                grid.innerHTML = '';
                highlights.core_skills.forEach(s => {
                    const stars = '⭐'.repeat(s.rating || 5);
                    grid.innerHTML += `
                        <div class="skill-card highlight-card">
                            <div class="skill-header">
                                <h3>${s.name}</h3>
                            </div>
                            <p class="description">${s.description}</p>
                            <div class="skill-meta">
                                <span class="rating">${stars}</span>
                                <span class="skill-tag">${s.category}</span>
                            </div>
                        </div>`;
                });
            }

            // --- 按分类展示技能 ---
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            categoryKeys.forEach(key => {
                const cat = categories[key];
                const note = cat.note ? `<span class="note">(${cat.note})</span>` : '';
                let chips = '';
                cat.skills.forEach(name => {
                    const extraClass = (cat.note && cat.note.includes('系统内置')) ? 'system-builtin' : '';
                    chips += `<span class="skill-chip ${extraClass}">${name}</span>`;
                });
                container.innerHTML += `
                    <div class="category-section" data-category="${key}">
                        <h3>${key} ${note} <span style="font-weight:normal;font-size:0.85rem;color:#999;">(${cat.count})</span></h3>
                        <div class="category-skills">${chips}</div>
                    </div>`;
            });

            // --- 更新日志 ---
            if (updateLog && updateLog.length > 0) {
                const clSection = document.getElementById('changelog-section');
                clSection.style.display = 'block';
                const clContainer = document.getElementById('changelog-container');
                clContainer.className = 'update-log';
                clContainer.innerHTML = '';
                updateLog.forEach(log => {
                    const changes = log.changes.map(c => `<li>${c}</li>`).join('');
                    clContainer.innerHTML += `
                        <div style="margin-bottom:1rem;">
                            <span class="version-tag">${log.version}</span>
                            <strong>${log.date}</strong>
                            <ul>${changes}</ul>
                        </div>`;
                });
            }

            // --- 页脚 ---
            document.getElementById('footer-info').innerHTML =
                `<p>&copy; 2026 Skill Store. 最后更新: ${meta.last_updated}</p>` +
                `<p>备份位置: ${meta.backup_location} (覆盖率 ${meta.backup_coverage})</p>` +
                `<p><a href="${meta.repository}" target="_blank">${meta.repository}</a></p>`;
        }

        document.addEventListener('DOMContentLoaded', loadSkills);
    </script>
</body>
</html>
